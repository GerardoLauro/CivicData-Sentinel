name: Quality gates
'on':
  workflow_dispatch:
  push:
    branches-ignore: [sentinel-state]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test,dashboard,dev]' twine
      - run: python -m ruff check src tests dashboard scripts
      - run: python -m ruff format --check src tests dashboard scripts
      - run: python -m pytest --cov=civicdata_sentinel --cov-fail-under=85 --cov-report=xml:reports/coverage.xml --cov-report=term-missing --junitxml=reports/tests.xml
      - run: python -m pip check
      - run: python -m build
      - name: Validate distributions
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python }}
          path: |
            reports/tests.xml
            reports/coverage.xml
            dist/*
          retention-days: 30
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dashboard,dev]'
      - run: python -m pip_audit --skip-editable --format=json --output=dependency-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit
          path: dependency-audit.json
