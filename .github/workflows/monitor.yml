name: Daily Madrid data check
'on':
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * *'
permissions:
  contents: write
concurrency:
  group: civicdata-monitor
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Refresh persisted state before acquisition
        run: git pull --ff-only
      - name: Run monitor and retain outcome
        shell: bash
        run: |
          set +e
          sentinel run --config configs/madrid_fountains.yaml --db state/sentinel.sqlite --output reports/latest.json
          code=$?
          echo "RUN_EXIT_CODE=$code" >> "$GITHUB_ENV"
          exit 0
      - name: Retain evidence even when persistence fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: madrid-check-${{ github.run_id }}
          path: |
            reports/latest.json
            state/sentinel.sqlite
          if-no-files-found: warn
      - name: Save history and latest report in repository
        if: ${{ always() && env.RUN_EXIT_CODE != '' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f state/sentinel.sqlite reports/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): store Madrid check [skip ci]"
            git push
          fi
      - name: Fail workflow when ingestion failed
        if: ${{ always() && env.RUN_EXIT_CODE != '' && env.RUN_EXIT_CODE != '0' }}
        run: exit 1
