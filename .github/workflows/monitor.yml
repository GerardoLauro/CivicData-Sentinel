name: Monitor public datasets
'on':
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: sentinel-state-writer
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Restore trusted state
        run: python scripts/state_branch.py restore
      - name: Collect all contracts
        shell: bash
        run: |
          set +e
          sentinel run-all --db state/sentinel.sqlite --output-dir reports
          code=$?
          echo "RUN_EXIT_CODE=$code" >> "$GITHUB_ENV"
          exit 0
      - name: Create portable audit backup
        if: ${{ always() && env.RUN_EXIT_CODE != '' }}
        run: |
          sentinel backup --db state/sentinel.sqlite --output backups/sentinel.sqlite
          sentinel alerts --db state/sentinel.sqlite > reports/incident-transitions.json
      - name: Persist state on separate branch
        if: ${{ always() && env.RUN_EXIT_CODE != '' }}
        run: python scripts/state_branch.py persist
      - name: Retain evidence even if state push fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-check-${{ github.run_id }}
          path: |
            reports/
            backups/sentinel.sqlite
          if-no-files-found: warn
          retention-days: 30
      - name: Surface unsuccessful acquisition or quarantine
        if: ${{ always() && env.RUN_EXIT_CODE != '' && env.RUN_EXIT_CODE != '0' }}
        run: exit 1
