[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "civicdata-sentinel"
version = "0.2.4b0"
description = "Lightweight, explainable monitoring for public CSV datasets"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "CivicData Sentinel contributors"}]
dependencies = ["httpx>=0.25,<1", "PyYAML>=6,<7", "pydantic>=2.9,<3", "filelock>=4.2.1,<5", "tzdata>=2024.1"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.50,<2"]
test = ["pytest>=8,<10", "pytest-cov>=6,<8", "hypothesis>=6,<7"]
dev = ["ruff>=0.9,<1", "pip-audit>=2.9,<3", "build>=1.2,<2"]

[project.scripts]
sentinel = "civicdata_sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["dashboard: requires the optional Streamlit dependency", "integration: local integration without live network"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.coverage.run]
source = ["civicdata_sentinel"]
